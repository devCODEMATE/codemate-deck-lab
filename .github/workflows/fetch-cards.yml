name: Fetch Standard Cards

on:
  schedule:
    - cron: '0 6 * * 1' # every Monday 06:00 UTC
  workflow_dispatch: {} # allows manual trigger from the Actions tab

jobs:
  fetch-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # first run (no cache yet) can take a while; later runs will be fast
    permissions:
      contents: write # allows the bot to commit and push data/ changes back to the repo
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and cache TCGdex card data
        run: node scripts/fetch-tcgdex.js

      - name: Build Standard catalog from cache
        run: node scripts/build-standard-catalog.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/standard-cards.json data/sets.json data/cards/by-set/
          git diff --staged --quiet || git commit -m "chore: update standard card catalog [skip ci]"
          git push